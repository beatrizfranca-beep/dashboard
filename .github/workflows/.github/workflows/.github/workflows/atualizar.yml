name: Atualizar Dados Diariamente

on:
  schedule:
    # Roda todos os dias às 03:00 da manhã (horário UTC)
    - cron: '0 3 * * *'
  workflow_dispatch: # Adiciona um botão para você rodar manualmente quando quiser

permissions:
  contents: write # Dá permissão para o robô salvar o arquivo no repositório

jobs:
  atualizar-json:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar os arquivos do repositório
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Rodar o script Python
        env:
          PLANILHA_URL: ${{ secrets.PLANILHA_URL }}
        run: python atualizar_dados.py

      - name: Salvar (Commit & Push) o novo arquivo JSON
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add dados.json
          # Só faz o commit se houver alguma mudança nos dados
          git commit -m "🤖 Atualização diária dos dados da monitoria" || exit 0
          git push
